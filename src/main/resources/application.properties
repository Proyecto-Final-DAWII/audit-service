# Servidor
server.port=8083

# Nombre de la aplicación para Eureka
spring.application.name=audit-service

# Configuración de Base de Datos MySQL

spring.datasource.username=root
spring.datasource.password=587932
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/assetflow_audit?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cliente Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/